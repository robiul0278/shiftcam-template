<header id="announcement-bar" class="bg-[#0a84c6]">
  <!-- Top blue strip -->
  <div class="bg-[#0a84c6] px-4 py-2 text-center text-[13px] font-semibold text-white">
    <a href="#" class="underline underline-offset-2 focus-visible:outline focus-visible:outline-2 focus-visible:outline-white">
      New iPhone is here — shop Gear for iPhone18
    </a>
  </div>
 
  <!-- Dark bar: rounded ONLY on top-left and top-right; bottom corners square -->
  <div class="flex h-[52px] items-center justify-between rounded-tl-[28px] rounded-tr-[28px] rounded-bl-none rounded-br-none bg-[#222] px-6 text-white md:px-12">
 
    <!-- Social icons -->
    <div class="hidden items-center gap-6 sm:flex">
      <a href="#" aria-label="Facebook" class="rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-white">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M14 8V6.5c0-.7.2-1 1.2-1H17V2h-2.6C11.4 2 10 3.7 10 6.1V8H8v3.5h2V22h4V11.5h2.8L17 8h-3z"/></svg>
      </a>
      <a href="#" aria-label="Instagram" class="rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-white">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="#" aria-label="YouTube" class="rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-white">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M22 8.2c-.2-1-.9-1.7-1.9-1.9C18.4 6 12 6 12 6s-6.4 0-8.1.3C3 6.5 2.2 7.2 2 8.2 1.7 9.9 1.7 12 1.7 12s0 2.1.3 3.8c.2 1 .9 1.7 1.9 1.9C5.6 18 12 18 12 18s6.4 0 8.1-.3c1-.2 1.7-.9 1.9-1.9.3-1.7.3-3.8.3-3.8s0-2.1-.3-3.8zM10 15V9l5.2 3L10 15z"/></svg>
      </a>
      <a href="#" aria-label="LinkedIn" class="rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-white">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h18v18H3V3z"/><path class="fill-[#222]" d="M7.6 9.5V18h2.6V9.5H7.6zM8.9 5.9a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM11.5 9.5V18h2.6v-4.3c0-1.100.6-1.800 1.500-1.800s1.400.6 1.400 1.800V18h2.600v-4.900c0-2.200-1.200-3.800-3.100-3.800-1.100 0-1.900.6-2.500 1.300V9.500h-2.500z"/></svg>
      </a>
    </div>
 
    <!-- Slider -->
    <div id="ann-slider" class="mx-auto flex items-center gap-4 sm:mx-0 sm:gap-6" role="region" aria-roledescription="carousel" aria-label="Store announcements">
      <button type="button" data-ann-prev aria-label="Previous announcement" class="rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-white">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6l-6 6 6 6"/></svg>
      </button>
 
      <div class="relative h-6 w-[250px] text-xs font-medium sm:w-[340px] sm:text-sm" aria-live="polite">
        <p data-ann-slide class="absolute inset-0 flex items-center justify-center gap-2 whitespace-nowrap opacity-100 transition-opacity duration-300 motion-reduce:transition-none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v9H3zM14 9h4l3 3v3h-7"/><circle cx="7" cy="17" r="1.8"/><circle cx="17" cy="17" r="1.8"/></svg>
          Free Standard shipping for orders &gt;US$100
        </p>
        <p data-ann-slide aria-hidden="true" class="pointer-events-none absolute inset-0 flex items-center justify-center gap-2 whitespace-nowrap opacity-0 transition-opacity duration-300 motion-reduce:transition-none">
          New iPhone &amp; more — shop now for iPhone 18
        </p>
        <p data-ann-slide aria-hidden="true" class="pointer-events-none absolute inset-0 flex items-center justify-center gap-2 whitespace-nowrap opacity-0 transition-opacity duration-300 motion-reduce:transition-none">
          12-month warranty on all gear
        </p>
      </div>
 
      <button type="button" data-ann-next aria-label="Next announcement" class="rounded focus-visible:outline focus-visible:outline-2 focus-visible:outline-white">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6l6 6-6 6"/></svg>
      </button>
    </div>
 
    <!-- Country / currency -->
    <button type="button" aria-label="Change country and currency" class="hidden items-center gap-2 rounded text-sm font-medium focus-visible:outline focus-visible:outline-2 focus-visible:outline-white sm:flex">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="9" cy="7" rx="6" ry="3"/><path d="M3 7v4c0 1.7 2.7 3 6 3M3 11v4c0 1.7 2.7 3 6 3"/><ellipse cx="15" cy="14" rx="6" ry="3"/><path d="M9 14v3c0 1.7 2.7 3 6 3s6-1.3 6-3v-3"/></svg>
      Bangladesh (USD $)
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
</header>
